<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雨格 Rain Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed WebGL stage; a quiet glass control deck pinned bottom-left, readout top-left. Single dark look by design. */
  :root {
    --bg: #0c0d11;
    --ink: #e8ebf2;
    --mute: #8b91a3;
    --line: rgba(196, 210, 255, 0.10);
    --panel: rgba(15, 16, 22, 0.64);
    --accent: #19e6f0;
    --display: 'Chakra Petch', 'Noto Sans SC', system-ui, sans-serif;
    --body: 'Noto Sans SC', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); overflow: hidden; }
  body { font: 13px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; outline: none; }
  #c.dragging { cursor: grabbing; }

  .hud {
    position: fixed;
    top: calc(18px + env(safe-area-inset-top, 0px));
    left: calc(18px + env(safe-area-inset-left, 0px));
    pointer-events: none;
    display: grid; gap: 6px;
  }
  .brand { font: 600 22px/1 var(--display); letter-spacing: 0.06em; display: flex; align-items: baseline; gap: 10px; }
  .brand small { font: 500 11px/1 var(--mono); letter-spacing: 0.22em; color: var(--mute); }
  .readout { font: 400 11.5px/1.4 var(--mono); color: var(--mute); font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
  .readout b { color: var(--ink); font-weight: 500; }

  .panel {
    position: fixed;
    left: calc(16px + env(safe-area-inset-left, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(328px, calc(100vw - 32px));
    box-sizing: border-box;
    background: var(--panel);
    -webkit-backdrop-filter: blur(16px) saturate(1.3);
    backdrop-filter: blur(16px) saturate(1.3);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px 14px;
    display: grid; gap: 12px;
  }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .panel-head span { font: 500 11px/1 var(--mono); letter-spacing: 0.2em; color: var(--mute); text-transform: uppercase; }
  .panel-body { display: grid; gap: 14px; }
  .panel.collapsed .panel-body { display: none; }
  .field { display: grid; gap: 7px; }
  .field-top { display: flex; justify-content: space-between; align-items: baseline; }
  .field-top label, .field-top .lbl { font-size: 12px; color: var(--mute); }
  .field-top output { font: 500 12px/1 var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
  .seg { display: flex; flex-wrap: wrap; gap: 5px; }
  button.chip {
    font: 500 12px/1 var(--body);
    color: var(--mute);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 11px;
    cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
    transition: color .15s, background .15s, border-color .15s;
  }
  button.chip:hover { color: var(--ink); border-color: rgba(196, 210, 255, 0.24); }
  button.chip[aria-pressed="true"] { color: var(--bg); background: var(--ink); border-color: var(--ink); }
  button.chip:focus-visible, input[type=range]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sw { width: 22px; height: 8px; border-radius: 4px; flex: none; }
  .ghost { font: 500 11px/1 var(--mono); color: var(--mute); background: none; border: 0; cursor: pointer; padding: 4px 2px; letter-spacing: 0.08em; }
  .ghost:hover { color: var(--ink); }
  .ghost:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: rgba(196, 210, 255, 0.18); border-radius: 2px; }
  input[type=range]::-moz-range-track { height: 2px; background: rgba(196, 210, 255, 0.18); border-radius: 2px; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 3px; background: var(--ink); margin-top: -5px; box-shadow: 0 0 0 3px rgba(25, 230, 240, 0.18); }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 3px; background: var(--ink); }

  .hint {
    position: fixed;
    right: calc(18px + env(safe-area-inset-right, 0px));
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    font: 400 11px/1.9 var(--mono); color: var(--mute); text-align: right; pointer-events: none;
    letter-spacing: 0.02em;
  }
  .hint kbd { font: inherit; color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  body.ui-off .hud, body.ui-off .panel, body.ui-off .hint { display: none; }
  .err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--mute); }
  @media (max-width: 720px) { .hint { display: none; } .brand { font-size: 19px; } }
</style>
</head>
<body>

<canvas id="c" tabindex="0" aria-label="三维雨景：雨滴落在发光的瓷砖网格上，点击可以在该位置降雨"></canvas>

<header class="hud">
  <div class="brand">雨格 <small>RAIN · GRID</small></div>
  <div class="readout">镜头 <b id="r-shot">自动 · 等距</b> · <b id="r-rate">55</b> 滴/秒 · 落点 <b id="r-hits">0</b></div>
</header>

<section class="panel" id="panel" aria-label="控制面板">
  <div class="panel-head">
    <span>Controls</span>
    <div>
      <button class="ghost" id="b-collapse" aria-expanded="true">收起</button>
      <button class="ghost" id="b-hide" title="隐藏界面 (H)">隐藏 H</button>
    </div>
  </div>
  <div class="panel-body">
    <div class="field">
      <div class="field-top"><span class="lbl">镜头</span></div>
      <div class="seg" id="shots">
        <button class="chip" data-shot="auto" aria-pressed="true">自动</button>
        <button class="chip" data-shot="iso" aria-pressed="false">等距</button>
        <button class="chip" data-shot="top" aria-pressed="false">俯视</button>
        <button class="chip" data-shot="low" aria-pressed="false">低空</button>
        <button class="chip" data-shot="orbit" aria-pressed="false">环绕</button>
      </div>
    </div>
    <div class="field">
      <div class="field-top"><label for="rate">雨量</label><output id="o-rate" for="rate">55 滴/秒</output></div>
      <input type="range" id="rate" min="0" max="220" value="55">
    </div>
    <div class="field">
      <div class="field-top"><label for="wind">风</label><output id="o-wind" for="wind">无风</output></div>
      <input type="range" id="wind" min="-100" max="100" value="0">
    </div>
    <div class="field">
      <div class="field-top"><span class="lbl">色板</span></div>
      <div class="seg" id="pals"></div>
    </div>
    <div class="field">
      <div class="field-top"><span class="lbl">天气与声音</span></div>
      <div class="seg">
        <button class="chip" id="b-sound" aria-pressed="false">声音</button>
        <button class="chip" id="b-storm" aria-pressed="false">自动雷暴</button>
        <button class="chip" id="b-thunder" aria-pressed="false">落雷 ␣</button>
      </div>
    </div>
  </div>
</section>

<div class="hint">
  拖拽 旋转 · 滚轮 缩放 · 点击 召唤雨<br>
  <kbd>1</kbd>–<kbd>5</kbd> 镜头 · <kbd>Space</kbd> 落雷 · <kbd>S</kbd> 声音 · <kbd>H</kbd> 隐藏
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (s) => document.querySelector(s);
const rand = Math.random;
const pick = (a) => a[(rand() * a.length) | 0];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ------------------------------------------------------------------ palettes */
const PALETTES = {
  neon:    { name: '霓虹', tiles: ['#19e6f0', '#ffe81a', '#ff6fd0', '#ff4f8a', '#ff7a1a', '#ffffff', '#2be0b0', '#2a9df4', '#e8364a', '#8ff3ff'],
             rain: ['#19e6f0', '#19e6f0', '#ffe81a', '#ffffff', '#ff8fdc', '#ffe81a'] },
  aurora:  { name: '极光', tiles: ['#3cf2a6', '#22d3ee', '#7c5cff', '#b16cff', '#2b7fff', '#a7f3d0', '#5eead4'],
             rain: ['#a7f3d0', '#3cf2a6', '#22d3ee', '#c4b5fd', '#ffffff'] },
  ember:   { name: '熔金', tiles: ['#ff7a1a', '#ffb020', '#ff4d2e', '#ffd166', '#ff3d6e', '#fff1d6', '#e0531a'],
             rain: ['#ffd166', '#ffb020', '#fff1d6', '#ff7a1a', '#ff4d2e'] },
  glacier: { name: '冰川', tiles: ['#8ff3ff', '#19e6f0', '#4aa8ff', '#c9f6ff', '#ffffff', '#2a6df4'],
             rain: ['#ffffff', '#c9f6ff', '#8ff3ff', '#19e6f0'] },
};
for (const p of Object.values(PALETTES)) {
  p.tileC = p.tiles.map((h) => new THREE.Color(h));
  p.rainC = p.rain.map((h) => new THREE.Color(h));
}
let PAL = PALETTES.neon;

/* ------------------------------------------------------------------ renderer */
const canvas = $('#c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  document.body.insertAdjacentHTML('beforeend', '<div class="err">这台设备无法启动 WebGL。请换用支持 WebGL 2 的浏览器后重新打开。</div>');
  throw e;
}
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
const BG = new THREE.Color('#0c0d11');
const bgNow = BG.clone();
scene.background = bgNow;
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 500);

const U = {
  uTime: { value: 0 },
  uFlash: { value: 0 },
  uBg: { value: BG },
  uFogNear: { value: 30 },
  uFogFar: { value: 90 },
};
const FOG = /* glsl */`
  uniform vec3 uBg; uniform float uFogNear; uniform float uFogFar;
  float fogF(float d){ return 1.0 - smoothstep(uFogNear, uFogFar, d); }
`;

/* ------------------------------------------------------------------ grid of tiles */
const N = 22, SP = 1.0, HALF = (N - 1) * SP / 2, TILE = 0.84, TH = 0.16, TOP = TH / 2;
const TC = N * N;
const tileX = new Float32Array(TC), tileZ = new Float32Array(TC);
for (let iz = 0; iz < N; iz++) for (let ix = 0; ix < N; ix++) {
  const i = iz * N + ix; tileX[i] = -HALF + ix * SP; tileZ[i] = -HALF + iz * SP;
}
const baseCur = new Float32Array(TC * 3), baseTgt = new Float32Array(TC * 3);
const glow = new Float32Array(TC * 3), core = new Float32Array(TC), ant = new Float32Array(TC * 3);
const wh = new Float32Array(TC), wv = new Float32Array(TC);

const boxG = new THREE.BoxGeometry(TILE, TH, TILE);
const tileGeo = new THREE.InstancedBufferGeometry();
tileGeo.index = boxG.index;
tileGeo.setAttribute('position', boxG.attributes.position);
tileGeo.setAttribute('normal', boxG.attributes.normal);
tileGeo.setAttribute('uv', boxG.attributes.uv);
const aOff = new THREE.InstancedBufferAttribute(new Float32Array(TC * 3), 3).setUsage(THREE.DynamicDrawUsage);
const aBase = new THREE.InstancedBufferAttribute(new Float32Array(TC * 3), 3).setUsage(THREE.DynamicDrawUsage);
const aGlow = new THREE.InstancedBufferAttribute(new Float32Array(TC * 4), 4).setUsage(THREE.DynamicDrawUsage);
tileGeo.setAttribute('iOffset', aOff);
tileGeo.setAttribute('iBase', aBase);
tileGeo.setAttribute('iGlow', aGlow);
tileGeo.instanceCount = TC;

const tileMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: /* glsl */`
    attribute vec3 iOffset; attribute vec3 iBase; attribute vec4 iGlow;
    varying vec3 vN; varying vec2 vUv; varying vec3 vBase; varying vec4 vGlow; varying float vLy; varying float vDist;
    void main(){
      vec3 p = position + iOffset;
      vec4 wp = modelMatrix * vec4(p, 1.0);
      vN = normal; vUv = uv; vBase = iBase; vGlow = iGlow; vLy = position.y / ${TH.toFixed(3)} + 0.5;
      vec4 mv = viewMatrix * wp; vDist = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    uniform float uFlash;
    ${FOG}
    varying vec3 vN; varying vec2 vUv; varying vec3 vBase; varying vec4 vGlow; varying float vLy; varying float vDist;
    float sdRound(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
    void main(){
      vec3 col;
      if (vN.y > 0.5) {
        vec2 p = vUv - 0.5;
        float d = sdRound(p, vec2(0.43), 0.13) + 0.035;
        float aa = fwidth(d) * 1.25;
        float line = 1.0 - smoothstep(0.012, 0.012 + aa, abs(d));
        float inside = 1.0 - smoothstep(-aa, aa, d);
        float halo = exp(-abs(d) * 26.0) * inside;
        col = vec3(0.0105, 0.0112, 0.0145);
        col += vBase * (line * 0.026 + inside * 0.002);
        col += vGlow.rgb * (line * 1.25 + halo * 0.22 + inside * 0.035);
        float dc = length(p);
        float dotR = 0.07 + 0.05 * clamp(vGlow.a, 0.0, 1.0);
        float dotA = 1.0 - smoothstep(dotR, dotR + fwidth(dc) * 1.5, dc);
        col += normalize(vGlow.rgb + 1e-4) * vGlow.a * dotA * 0.9;
      } else if (vN.y < -0.5) {
        col = vec3(0.0);
      } else {
        col = vec3(0.0055, 0.006, 0.008) + vGlow.rgb * 0.30 * vLy * vLy + vBase * 0.012 * vLy;
      }
      float f = fogF(vDist);
      gl_FragColor = vec4(mix(uBg, col, f), 1.0);
    }`,
});
const tiles = new THREE.Mesh(tileGeo, tileMat);
tiles.frustumCulled = false;
scene.add(tiles);

function setPalette(key) {
  PAL = PALETTES[key];
  for (let i = 0; i < TC; i++) {
    const c = pick(PAL.tileC);
    const k = 0.45 + rand() * 0.45;
    baseTgt[i * 3] = c.r * k; baseTgt[i * 3 + 1] = c.g * k; baseTgt[i * 3 + 2] = c.b * k;
  }
}

/* ------------------------------------------------------------------ rain streaks */
const MAXD = 1400;
const drops = Array.from({ length: MAXD }, () => ({ on: false, c: new THREE.Color() }));
let dCursor = 0;
const plane = new THREE.PlaneGeometry(1, 1);
function instGeo(attrs, count) {
  const g = new THREE.InstancedBufferGeometry();
  g.index = plane.index;
  g.setAttribute('position', plane.attributes.position);
  const out = {};
  for (const [name, size] of Object.entries(attrs)) {
    out[name] = new THREE.InstancedBufferAttribute(new Float32Array(count * size), size).setUsage(THREE.DynamicDrawUsage);
    g.setAttribute(name, out[name]);
  }
  g.instanceCount = 0;
  return [g, out];
}
const [rainGeo, RA] = instGeo({ iPos: 3, iDir: 3, iColor: 4, iParams: 3 }, MAXD);
const rainMat = new THREE.ShaderMaterial({
  uniforms: U,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    attribute vec3 iPos; attribute vec3 iDir; attribute vec4 iColor; attribute vec3 iParams;
    varying float vT; varying float vX; varying vec4 vColor; varying float vY; varying float vFloor; varying float vDist;
    void main(){
      vec3 axis = -iDir;
      vec3 toCam = normalize(cameraPosition - iPos);
      vec3 side = cross(axis, toCam);
      float sl = length(side);
      side = sl > 1e-4 ? side / sl : vec3(1.0, 0.0, 0.0);
      float t = position.y + 0.5;
      vec3 wp = iPos + axis * t * iParams.x + side * position.x * iParams.y;
      vT = t; vX = position.x * 2.0; vColor = iColor; vY = wp.y; vFloor = iParams.z;
      vec4 mv = viewMatrix * vec4(wp, 1.0); vDist = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */`
    ${FOG}
    varying float vT; varying float vX; varying vec4 vColor; varying float vY; varying float vFloor; varying float vDist;
    void main(){
      if (vY < vFloor) discard;
      float t = clamp(vT, 0.0, 1.0), x = clamp(vX, -1.0, 1.0);
      float tail = pow(1.0 - t, 1.35);
      float a = tail * (1.0 - x * x);
      float head = smoothstep(0.86, 1.0, 1.0 - t);
      vec3 c = vColor.rgb * (0.75 + 1.3 * head);
      float abyss = smoothstep(-16.0, 0.0, vY);
      gl_FragColor = vec4(c * a * vColor.a * abyss * fogF(vDist), 1.0);
    }`,
});
const rain = new THREE.Mesh(rainGeo, rainMat);
rain.frustumCulled = false;
rain.renderOrder = 3;
scene.add(rain);

/* ------------------------------------------------------------------ squircle ripples */
const MAXR = 640;
const [ripGeo, PA] = instGeo({ iPos: 3, iCol: 3, iTime: 4, iShape: 2 }, MAXR);
for (let i = 0; i < MAXR; i++) { PA.iTime.array[i * 4] = -100; PA.iTime.array[i * 4 + 1] = 1; }
ripGeo.instanceCount = MAXR;
let rCursor = 0, ripDirty = true;
const ripMat = new THREE.ShaderMaterial({
  uniforms: U,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  vertexShader: /* glsl */`
    uniform float uTime;
    attribute vec3 iPos; attribute vec3 iCol; attribute vec4 iTime; attribute vec2 iShape;
    varying vec2 vL; varying vec3 vC; varying vec4 vT; varying vec2 vS; varying float vDist;
    void main(){
      float age = (uTime - iTime.x) / iTime.y;
      float Q = iTime.z + iShape.y * 2.0 + 0.06;
      vec2 L = position.xy * 2.0 * Q;
      vec3 wp = iPos + vec3(L.x, 0.0, L.y);
      vL = L; vC = iCol; vT = iTime; vS = iShape;
      vec4 mv = viewMatrix * vec4(wp, 1.0); vDist = -mv.z;
      gl_Position = projectionMatrix * mv;
      if (age < 0.0 || age > 1.0) gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
    }`,
  fragmentShader: /* glsl */`
    uniform float uTime;
    ${FOG}
    varying vec2 vL; varying vec3 vC; varying vec4 vT; varying vec2 vS; varying float vDist;
    float sq(vec2 p, float n){ p = abs(p) + 1e-5; return pow(pow(p.x, n) + pow(p.y, n), 1.0 / n); }
    void main(){
      float age = (uTime - vT.x) / vT.y;
      if (age < 0.0 || age > 1.0) discard;
      age = clamp(age, 0.0, 1.0);
      float d = sq(vL, vS.x);
      float e = 1.0 - pow(1.0 - age, 3.0);
      float aa = fwidth(d) * 1.2;
      float a;
      float fade = pow(1.0 - age, 1.7);
      if (vT.w < 0.5) {
        float r = 0.08 + e * vT.z;
        float th = vS.y * (1.0 - 0.55 * age);
        a = 1.0 - smoothstep(th * 0.5, th * 0.5 + aa, abs(d - r));
      } else if (vT.w < 1.5) {
        float r = 0.08 + e * vT.z;
        float th = vS.y * (1.0 - 0.5 * age);
        a = 1.0 - smoothstep(th * 0.5, th * 0.5 + aa, abs(d - r));
        a = max(a, 0.7 * (1.0 - smoothstep(th * 0.4, th * 0.4 + aa, abs(d - r * 0.6))));
        a = max(a, 0.45 * (1.0 - smoothstep(th * 0.3, th * 0.3 + aa, abs(d - r * 0.3))));
      } else {
        float r = vT.z * (0.55 + 0.45 * e);
        a = 1.0 - smoothstep(r, r + aa, d);
        fade = pow(1.0 - age, 2.4);
      }
      gl_FragColor = vec4(vC * a * fade * 0.95 * fogF(vDist), 1.0);
    }`,
});
const ripples = new THREE.Mesh(ripGeo, ripMat);
ripples.frustumCulled = false;
ripples.renderOrder = 2;
scene.add(ripples);

function addRipple(x, z, c, start, dur, maxR, type, n, thick, gain) {
  const i = rCursor; rCursor = (rCursor + 1) % MAXR;
  PA.iPos.array.set([x, TOP + 0.022, z], i * 3);
  PA.iCol.array.set([c.r * gain, c.g * gain, c.b * gain], i * 3);
  PA.iTime.array.set([start, dur, maxR, type], i * 4);
  PA.iShape.array.set([n, thick], i * 2);
  ripDirty = true;
}

/* ------------------------------------------------------------------ splash droplets */
const MAXP = 3200;
const P = {
  x: new Float32Array(MAXP), y: new Float32Array(MAXP), z: new Float32Array(MAXP),

  const t0 = iz * N + ix;
  if (bolt) { thunder(t0); return; }
  spawnDrop({ tile: t0, H: 6, size: 1.9 });
  for (let k = 0; k < 7; k++) {
    const jx = clamp(ix + Math.round((rand() * 2 - 1) * 1.6), 0, N - 1);
    const jz = clamp(iz + Math.round((rand() * 2 - 1) * 1.6), 0, N - 1);
    spawnDrop({ tile: jz * N + jx, H: 7 + k * 1.6 + rand() * 2, size: 0.8 + rand() * 0.6 });
  }
}

/* ------------------------------------------------------------------ UI */
const rateIn = $('#rate'), windIn = $('#wind');
function syncRate() { rate = +rateIn.value; $('#o-rate').textContent = `${rate} 滴/秒`; sound.setRate(); }
function syncWind() {
  wind = +windIn.value / 100;
  const v = Math.abs(windIn.value);
  $('#o-wind').textContent = v < 3 ? '无风' : `${wind < 0 ? '← 西' : '东 →'} ${v}%`;
}
rateIn.addEventListener('input', syncRate);
windIn.addEventListener('input', syncWind);

function setShot(name) {
  shotMode = name; autoT = 0;
  if (name === 'auto') autoIdx = 0;
  if (name === 'orbit' || (name === 'auto' && AUTO[0][0] === 'orbit')) orbitStart = time;
  document.querySelectorAll('#shots .chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.shot === name)));
}
document.querySelectorAll('#shots .chip').forEach((b) => b.addEventListener('click', () => setShot(b.dataset.shot)));

const palWrap = $('#pals');
for (const [key, p] of Object.entries(PALETTES)) {
  const b = document.createElement('button');
  b.className = 'chip'; b.dataset.pal = key; b.setAttribute('aria-pressed', String(key === 'neon'));
  const sw = document.createElement('span'); sw.className = 'sw';
  sw.style.background = `linear-gradient(90deg, ${p.tiles.slice(0, 4).join(', ')})`;
  b.append(sw, document.createTextNode(p.name));
  b.addEventListener('click', () => {
    setPalette(key);
    palWrap.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === b)));
  });
  palWrap.append(b);
}

const bSound = $('#b-sound'), bStorm = $('#b-storm');
function toggleSound() { const on = sound.toggle(); bSound.setAttribute('aria-pressed', String(on)); bSound.textContent = on ? '声音 开' : '声音'; }
bSound.addEventListener('click', toggleSound);
bStorm.addEventListener('click', () => { autoStorm = !autoStorm; bStorm.setAttribute('aria-pressed', String(autoStorm)); if (autoStorm) nextStorm = time + 4; });
$('#b-thunder').addEventListener('click', () => thunder());
$('#b-hide').addEventListener('click', () => document.body.classList.add('ui-off'));
const panel = $('#panel'), bCol = $('#b-collapse');
function setCollapsed(c) { panel.classList.toggle('collapsed', c); bCol.textContent = c ? '展开' : '收起'; bCol.setAttribute('aria-expanded', String(!c)); }
bCol.addEventListener('click', () => setCollapsed(!panel.classList.contains('collapsed')));
if (innerWidth < 560) setCollapsed(true);

addEventListener('keydown', (e) => {
  if (e.target instanceof HTMLInputElement && e.key !== ' ') return;
  if (e.target instanceof HTMLButtonElement && (e.key === ' ' || e.key === 'Enter')) return;
  const map = { '1': 'auto', '2': 'iso', '3': 'top', '4': 'low', '5': 'orbit' };
  if (map[e.key]) setShot(map[e.key]);
  else if (e.key === ' ') { e.preventDefault(); thunder(); }
  else if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('ui-off');
  else if (e.key === 's' || e.key === 'S') toggleSound();
});
if (REDUCED) setShot('iso');

/* ------------------------------------------------------------------ boot */
setPalette('neon');
baseCur.set(baseTgt);
for (let i = 0; i < 200; i++) simulate(1 / 60);   // pre-warm so the first frame is already raining
impacts = 0;
updateCamera(10, 0);

const rShot = $('#r-shot'), rRate = $('#r-rate'), rHits = $('#r-hits');
let hudT = 0;
const clock = new THREE.Clock();
function frame() {
  const realDt = Math.min(clock.getDelta(), 0.05);
  simulate(realDt);
  updateCamera(realDt, realDt);
  composer.render(realDt);
  hudT += realDt;
  if (hudT > 0.25) {
    hudT = 0;
    rShot.textContent = shotMode === 'auto' ? `自动 · ${SHOT_NAMES[currentShotName()]}` : SHOT_NAMES[shotMode];
    rRate.textContent = rate;
    rHits.textContent = impacts.toLocaleString('zh-CN');
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// test / automation hook
window.__rain = { setShot, thunder, simulate, setPalette, snap(n) { setShot(n); Object.assign(cur, SHOTS[n]); offs.th = offs.ph = 0; }, get time() { return time; } };
</script>

</body>
